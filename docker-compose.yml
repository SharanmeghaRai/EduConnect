version: '3.8'

services:
  # ---------------------------------------------
  # Tier 3: PostgreSQL Database
  # ---------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: educonnect_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: educonnect_user
      POSTGRES_PASSWORD: educonnect_password
      POSTGRES_DB: educonnect_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educonnect_user -d educonnect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------
  # Tier 2: Application / Logic Layer (Node.js API)
  # ---------------------------------------------
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: educonnect_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://educonnect_user:educonnect_password@db:5432/educonnect_db?schema=public"
      JWT_SECRET: "educonnect-prod-secret-key-change-me"
      REFRESH_TOKEN_SECRET: "educonnect-prod-refresh-secret-change-me"
      CLIENT_URL: "http://localhost:80"
      ALLOWED_EMAIL_DOMAIN: ""
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------
  # Tier 1: Presentation Layer (React + Nginx)
  # ---------------------------------------------
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: educonnect_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
    driver: local
